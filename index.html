<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06161b"><title>Content Center</title><style>:root{--bg:#06161b;--p:#0a2229;--l:#17414b;--c:#62e8f4;--t:#f4fbfc;--m:#86a6ad;--ok:#63e5b5;--w:#ffd36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#0a3038,#06161b 45%);color:var(--t);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{padding:20px 15px;border-right:1px solid #12343d;background:#051319cc;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 20px;font-weight:800;letter-spacing:.07em}.mark{width:36px;height:36px;border:1px solid #2a6874;border-radius:12px;display:grid;place-items:center}.mark:after{content:"";width:13px;height:13px;border:2px solid var(--c);transform:rotate(45deg);border-radius:3px}.nav{display:block;width:100%;text-align:left;background:none;color:#95b2b8;border:0;border-radius:11px;padding:11px 12px;margin:4px 0;cursor:pointer}.nav.on,.nav:hover{background:#0d2a32;color:#fff;box-shadow:inset 0 0 0 1px #1a4650}.sync{position:absolute;bottom:18px;left:15px;right:15px;border:1px solid #16414b;background:#092129;border-radius:14px;padding:12px}.sync b{font-size:12px}.sync small{display:block;color:var(--m);margin-top:5px;line-height:1.4}.dot{float:right;color:var(--ok)}main{padding:24px 28px 50px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.ey{font-size:10px;color:var(--c);letter-spacing:.15em;text-transform:uppercase}h1{font-size:28px;margin:3px 0 0;letter-spacing:-.04em}select,button{height:42px;border:1px solid var(--l);background:#092129;color:#fff;border-radius:12px;padding:0 12px}.client{min-width:220px}.btn{background:linear-gradient(135deg,var(--c),#31cbd8);color:#032126;border:0;font-weight:800;cursor:pointer}.view{display:none}.view.on{display:block}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.card{background:linear-gradient(145deg,#0c2931,#081d23);border:1px solid #16414b;border-radius:18px;padding:17px;box-shadow:0 16px 45px #0005}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.lab{font-size:10px;color:#86aab2;letter-spacing:.12em;text-transform:uppercase}.stage{font-size:24px;font-weight:800;letter-spacing:-.035em;margin-top:4px}.sub{color:var(--m);font-size:12px;line-height:1.5}.badge{color:var(--c);border:1px solid #27616c;border-radius:999px;padding:5px 8px;font-size:10px}.bar{height:7px;background:#071b20;border-radius:99px;overflow:hidden;margin-top:17px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1fc7d5,var(--c))}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#081f26;border:1px solid #123942;border-radius:14px;padding:14px}.metric b{display:block;font-size:24px}.metric small{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border-bottom:0}.rt{font-size:12px}.rs{font-size:10px;color:var(--m);margin-top:3px}.status{font-size:10px;padding:5px 7px;border-radius:999px;white-space:nowrap}.approved{color:var(--ok);background:#63e5b51a}.production{color:var(--c);background:#62e8f41a}.draft{color:var(--w);background:#ffd36b1a}.review{color:#ffadad;background:#ff7f7f1a}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.section h2{margin:0;font-size:18px}.section p{margin:4px 0 0;color:var(--m);font-size:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.tw{overflow:auto}.table th{text-align:left;font-size:10px;color:#7898a0;text-transform:uppercase;letter-spacing:.1em;padding:0 10px 10px}.table td{padding:12px 10px;border-top:1px solid #ffffff0d;font-size:12px}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.lane{min-height:340px;background:#071d23;border:1px solid #123941;border-radius:16px;padding:11px}.lane h3{font-size:10px;color:#87a8af;text-transform:uppercase;letter-spacing:.1em}.task{background:#0b2830;border:1px solid #16434d;border-radius:12px;padding:11px;margin-bottom:8px}.task b{font-size:11px}.task p{color:var(--m);font-size:10px}.ints{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.int{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#092129;border:1px solid #17414b;border-radius:15px;padding:15px}.logo{width:38px;height:38px;border:1px solid #20515b;border-radius:11px;display:grid;place-items:center;color:var(--c);font-weight:800}.ok{color:var(--ok);font-size:10px}.need{color:var(--w);font-size:10px}@media(max-width:900px){.app{grid-template-columns:78px 1fr}.side{padding:16px 9px}.brand span,.nav span,.sync{display:none}.brand{justify-content:center}.nav{text-align:center}.grid{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}.side{position:fixed;z-index:9;bottom:0;top:auto;left:0;right:0;height:66px;border-right:0;border-top:1px solid #163b44;padding:7px;background:#041318f2}.brand,.sync{display:none}.menu{display:flex;overflow:auto}.nav{min-width:60px;height:50px;margin:0}.nav:nth-child(n+6){display:none}main{padding:16px 13px 84px}.top{display:block}.top>div:last-child{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.client{min-width:0;width:100%}.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.kanban{display:flex;overflow:auto}.lane{min-width:260px}.ints{grid-template-columns:1fr}h1{font-size:24px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark"></div><span>CONTENT CENTER</span></div><div class="menu" id="menu"></div><div class="sync"><b>ChatGPT sync <span class="dot">●</span></b><small>GPT + Composio управляют контентом и публикациями.</small></div></aside><main><div class="top"><div><div class="ey" id="crumb">Контент-центр</div><h1 id="title">Главная</h1></div><div><select class="client" id="client"></select><button class="btn" id="copy">GPT-команда</button></div></div><section class="view on" id="dashboard"></section><section class="view" id="plan"></section><section class="view" id="production"></section><section class="view" id="publishing"></section><section class="view" id="integrations"></section></main></div><script>const D={clients:[{id:'maxway',name:'Max Way',type:'Турагентство',stage:'Контент и доверие',progress:72,ig:0,tg:0},{id:'solyanik',name:'Соляник Фэмили',type:'Премиальная мебель',stage:'Кейсы и лиды',progress:58,ig:1,tg:1}],content:[{c:'maxway',t:'Перелёт с малышом: чем занять в самолёте',f:'Reels',ch:'Instagram',s:'production',d:'20 сен'},{c:'maxway',t:'Трансфер: почему это удобно',f:'Reels',ch:'Instagram',s:'draft',d:'22 сен'},{c:'maxway',t:'Молодожёны: Абу-Даби + Мальдивы',f:'Stories',ch:'Instagram',s:'approved',d:'19 сен'},{c:'maxway',t:'Salinda Resort Phu Quoc — обзор',f:'Reels',ch:'Instagram',s:'review',d:'21 сен'},{c:'solyanik',t:'Кейс кухни: до / после проекта',f:'Carousel',ch:'Instagram',s:'draft',d:'23 сен'},{c:'solyanik',t:'Почему фасады шире 600 мм делим',f:'Reels',ch:'Instagram',s:'production',d:'24 сен'},{c:'solyanik',t:'Egger / Blum: материалы премиальной кухни',f:'Post',ch:'Telegram',s:'approved',d:'20 сен'}]};const M=[['dashboard','⌂','Главная'],['plan','▦','Контент-план'],['production','◫','Производство'],['publishing','↗','Публикации'],['integrations','⚙','Интеграции']];let cur='maxway',view='dashboard';const C=()=>D.clients.find(x=>x.id==cur),I=()=>D.content.filter(x=>x.c==cur),ST=s=>({draft:'Черновик',approved:'Одобрено',production:'В работе',review:'Согласование'}[s]);function nav(){menu.innerHTML=M.map(x=>'<button class="nav '+(x[0]==view?'on':'')+'" data-v="'+x[0]+'">'+x[1]+' <span>'+x[2]+'</span></button>').join('');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.v))}function sel(){client.innerHTML=D.clients.map(x=>'<option value="'+x.id+'">'+x.name+' · '+x.type+'</option>').join('');client.value=cur;client.onchange=e=>{cur=e.target.value;render()}}function dash(){let c=C(),a=I(),ap=a.filter(x=>x.s=='approved').length;dashboard.innerHTML='<div class="hero"><div class="card"><div class="head"><div><div class="lab">Текущий этап</div><div class="stage">'+c.stage+'</div></div><span class="badge">'+c.progress+'% цикла</span></div><div class="sub">'+c.name+' · контент, материалы и аккаунты изолированы от других клиентов.</div><div class="bar"><i style="width:'+c.progress+'%"></i></div></div><div class="metrics"><div class="metric"><b>'+a.length+'</b><small>материалов</small></div><div class="metric"><b>'+ap+'</b><small>готово</small></div><div class="metric"><b>'+a.filter(x=>x.s!='approved').length+'</b><small>в работе</small></div></div></div><div class="grid"><div class="card"><div class="head"><div><div class="lab">Ближайший контент</div><b>План</b></div></div>'+a.slice(0,4).map(x=>'<div class="row"><div><div class="rt">'+x.t+'</div><div class="rs">'+x.d+' · '+x.ch+'</div></div><span class="status '+x.s+'">'+ST(x.s)+'</span></div>').join('')+'</div><div class="card"><div class="lab">Рабочая база</div><div class="stage" style="font-size:18px">Материалы клиента</div><p class="sub">Бренд, tone of voice, сценарии, фото/видео, документы, CTA и шаблоны.</p></div><div class="card"><div class="lab">Интеграции</div><div class="row"><b>Instagram</b><span class="'+(c.ig?'ok':'need')+'">'+(c.ig?'● подключено':'○ подключить')+'</span></div><div class="row"><b>Telegram</b><span class="'+(c.tg?'ok':'need')+'">'+(c.tg?'● подключено':'○ подключить')+'</span></div><div class="row"><b>ChatGPT / Composio</b><span class="ok">● активно</span></div></div></div>'}function planv(){plan.innerHTML='<div class="section"><div><h2>Контент-план · '+C().name+'</h2><p>Дата, формат, канал и статус.</p></div></div><div class="card tw"><table class="table"><tr><th>Дата</th><th>Материал</th><th>Формат</th><th>Канал</th><th>Статус</th></tr>'+I().map(x=>'<tr><td>'+x.d+'</td><td><b>'+x.t+'</b></td><td>'+x.f+'</td><td>'+x.ch+'</td><td><span class="status '+x.s+'">'+ST(x.s)+'</span></td></tr>').join('')+'</table></div>'}function prod(){let cols=[['draft','Черновики'],['production','В работе'],['review','Согласование'],['approved','Готово']];production.innerHTML='<div class="section"><div><h2>Производство · '+C().name+'</h2><p>Канбан контентного цикла.</p></div></div><div class="kanban">'+cols.map(z=>'<div class="lane"><h3>'+z[1]+'</h3>'+I().filter(x=>x.s==z[0]).map(x=>'<div class="task"><b>'+x.t+'</b><p>'+x.f+' · '+x.ch+'</p><span class="sub">'+x.d+'</span></div>').join('')+'</div>').join('')+'</div>'}function pub(){let a=I().filter(x=>x.s=='approved');publishing.innerHTML='<div class="section"><div><h2>Публикации · '+C().name+'</h2><p>В очередь попадает только одобренный контент.</p></div></div><div class="card">'+(a.length?a.map(x=>'<div class="row"><div><div class="rt">'+x.t+'</div><div class="rs">'+x.d+' · '+x.f+'</div></div><span class="badge">'+x.ch+'</span></div>').join(''):'<p class="sub">Нет одобренных материалов.</p>')+'</div>'}function ints(){let c=C();integrations.innerHTML='<div class="section"><div><h2>Интеграции · '+c.name+'</h2><p>Аккаунты подключаются отдельно для каждого клиента.</p></div></div><div class="ints"><div class="int"><div><b>ChatGPT</b><div class="rs">Управление через чат</div></div><span class="ok">● Composio</span></div><div class="int"><div><b>GitHub</b><div class="rs">Версии интерфейса</div></div><span class="ok">● подключено</span></div><div class="int"><div><b>Instagram</b><div class="rs">Business / Creator</div></div><span class="'+(c.ig?'ok':'need')+'">'+(c.ig?'● подключено':'○ требуется аккаунт')+'</span></div><div class="int"><div><b>Telegram</b><div class="rs">Bot + channel</div></div><span class="'+(c.tg?'ok':'need')+'">'+(c.tg?'● подключено':'○ требуется бот')+'</span></div></div><div class="card" style="margin-top:12px"><div class="lab">Правило изоляции</div><p class="sub">Для каждого клиента используются отдельные контент, медиатека, social account IDs, очередь публикаций и аналитика. Перед постингом ChatGPT обязан сверять выбранного клиента с подключённым аккаунтом.</p></div>'}function render(){sel();dash();planv();prod();pub();ints();show(view)}function show(v){view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==v));title.textContent=M.find(x=>x[0]==v)[2];crumb.textContent='Контент-центр · '+C().name;nav()}copy.onclick=()=>navigator.clipboard.writeText('Контент-центр. Работай только с клиентом '+C().name+'. Не смешивай данные других клиентов. Текущий контент: '+JSON.stringify(I())).then(()=>alert('GPT-команда скопирована'));render();</script></body></html>
