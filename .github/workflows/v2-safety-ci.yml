name: Content Center V2 safety checks

on:
  push:
    branches:
      - 'feat/content-center-v2-safety-*'
      - 'feat/content-center-v2-brand-dna-*'
      - 'feat/content-center-v2-default-*'
      - 'feat/content-center-v2-ai-handoff-*'
      - 'fix/content-center-v2-brand-nav-*'
      - 'release/v2-candidate-*'
  pull_request:
    branches:
      - 'feat/content-center-v2-foundation-20260923'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node regression and asset syntax
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute regression suite
        run: node --test tests/*.test.cjs
      - name: Check V2 JavaScript syntax
        run: |
          for file in v2/*.js service-worker.js; do node --check "$file"; done
      - name: Ensure opt-in modules are cached for PWA
        run: |
          node -e "const f=require('fs');const h=f.readFileSync('index.html','utf8');const s=f.readFileSync('service-worker.js','utf8');for(const p of ['v2/content-dedup.js','v2/content-dedup-ui.js','v2/handoff-ui.js','v2/workspace.js']){if(!h.includes(p)||!s.includes(p))throw Error('Missing script/cache entry: '+p)}"

  browser-smoke:
    name: Isolated Chromium desktop and mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual V2 HTML against mocked Supabase (no production API requests)
        run: node tests/browser-smoke.cjs
      - name: Test real service worker cache update preserves local state
        run: node tests/pwa-cache-smoke.cjs
  webkit-smoke:
    name: Safari WebKit isolated desktop and mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install WebKit engine and runtime dependencies
        run: npx playwright install --with-deps webkit
      - name: Test actual V2 with mock-only owner and client data in WebKit
        env:
          BROWSER_ENGINE: webkit
        run: node tests/browser-smoke.cjs

  backup-integrity:
    name: Offline database export integrity and tamper guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test private export integrity with synthetic SQL only
        run: python -m unittest discover -s tests -p 'test_cc_backup_guard.py' -v

  postgres-recovery-smoke:
    name: PostgreSQL 17 disposable real dump and restore (fictional data)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-fictional-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore genuine pg_dump fixture in separate disposable database
        env:
          PGHOST: postgres
        run: bash tests/postgres-recovery-smoke.sh
